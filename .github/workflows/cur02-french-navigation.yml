name: CUR-02 French Course Navigation
on:
  push:
    branches: [feature/cur02-six-level-french-course-20261026]
permissions:
  contents: read
jobs:
  course:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Execute native source-preserving navigation checks
        run: node --experimental-strip-types --test tests/cur02-level-navigation.test.mjs
      - name: Install public toolchain
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check French TypeScript
        run: npm run typecheck:vnext
      - name: Build French candidate without deployment
        run: npm run build:vnext
      - name: Install isolated browser runner
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.63.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify actual mobile course navigation in Chromium
        run: |
          npx vite preview --config vite.config.ts --host 127.0.0.1 --port 4173 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          node tests/cur02-browser.mjs
 