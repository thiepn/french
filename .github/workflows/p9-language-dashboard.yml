name: P9 Language Dashboard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/verify-language-read-model-p8.mjs
      - run: node scripts/verify-language-dashboard-p9.mjs
