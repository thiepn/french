name: French controlled production deployment

on:
  workflow_dispatch:
    inputs:
      target:
        description: Production artifact to deploy
        required: true
        type: choice
        options:
          - vnext
          - p35-rollback
      confirmation:
        description: Type CUTOVER VNEXT or ROLLBACK P35
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: french-production-pages
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate explicit production intent
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" == "vnext" && "$CONFIRMATION" != "CUTOVER VNEXT" ]]; then
            echo "vNext deployment requires exact confirmation: CUTOVER VNEXT"
            exit 1
          fi
          if [[ "$TARGET" == "p35-rollback" && "$CONFIRMATION" != "ROLLBACK P35" ]]; then
            echo "P35 rollback requires exact confirmation: ROLLBACK P35"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Qualify selected artifact
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" == "vnext" ]]; then
            npm install --ignore-scripts --no-audit --no-fund
            npm run qualify:vnext
          else
            node scripts/verify-production-p34.mjs
          fi

      - name: Prepare isolated Pages artifact
        run: node scripts/prepare-pages-artifact.mjs "${{ inputs.target }}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: deploy-site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy selected artifact
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify production artifact reached french.thiepn.dev
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            html="$(curl -fsS --max-time 15 https://french.thiepn.dev/ || true)"
            marker="$(curl -fsS --max-time 15 https://french.thiepn.dev/deployment-marker.json || true)"
            if [[ "$TARGET" == "vnext" ]]; then
              if grep -Fq 'data-runtime="vnext"' <<<"$html" && grep -Fq '"target": "vnext"' <<<"$marker"; then
                exit 0
              fi
            else
              if grep -Fq 'P35 Stable Release, Live Browser/Device Acceptance & Defect-Only Hardening' <<<"$html" && grep -Fq '"target": "p35-rollback"' <<<"$marker"; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Selected French production artifact did not reach the custom domain."
          exit 1
