name: P35 stable release acceptance

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: p35-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Re-run full qualification including P35
        run: node scripts/verify-production-p34.mjs

  browser-local:
    needs: static
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium-desktop
            engine: chromium
          - project: firefox-desktop
            engine: firefox
          - project: webkit-desktop
            engine: webkit
          - project: android-chrome
            engine: chromium
          - project: ios-webkit
            engine: webkit
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned Playwright
        run: npm install --no-save @playwright/test@1.63.0
      - name: Install browser engine
        run: npx playwright install --with-deps "${{ matrix.engine }}"
      - name: Start local release candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/french-p35-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/release.json >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/french-p35-server.log
          exit 1
      - name: Run isolated browser acceptance
        run: npx playwright test --config tests/playwright.p35.config.mjs --project="${{ matrix.project }}"
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: french-p35-local-${{ matrix.project }}-${{ github.sha }}
          path: test-results/p35
          if-no-files-found: ignore
          retention-days: 30

  live-production:
    if: github.event_name == 'push'
    needs: browser-local
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium-desktop
            engine: chromium
          - project: firefox-desktop
            engine: firefox
          - project: webkit-desktop
            engine: webkit
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      P35_BASE_URL: https://french.thiepn.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for GitHub Pages to expose P35
        shell: bash
        run: |
          set -euo pipefail
          marker='P35 Stable Release, Live Browser/Device Acceptance & Defect-Only Hardening'
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 15 https://french.thiepn.dev/ | grep -Fq "$marker"; then
              exit 0
            fi
            sleep 10
          done
          echo "P35 marker did not reach production."
          exit 1
      - name: Install pinned Playwright
        run: npm install --no-save @playwright/test@1.63.0
      - name: Install production browser engine
        run: npx playwright install --with-deps "${{ matrix.engine }}"
      - name: Run isolated live browser acceptance
        run: npx playwright test --config tests/playwright.p35.config.mjs --project="${{ matrix.project }}"
      - name: Preserve live failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: french-p35-live-${{ matrix.project }}-${{ github.sha }}
          path: test-results/p35
          if-no-files-found: ignore
          retention-days: 30
