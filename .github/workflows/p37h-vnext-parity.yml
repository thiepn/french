name: P37H vNext production parity

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p37h-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Confirm exact committed source HEAD
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned vNext toolchain
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run exact-head CUR-02 source navigation contract
        run: node --experimental-strip-types --test tests/cur02-level-navigation.test.mjs
      - name: Run full vNext qualification
        run: npm run qualify:vnext
      - name: Verify new original B2 course content and immutable prior lesson identities
        run: node --experimental-strip-types scripts/test-vnext-b2-extension.mts
      - name: Verify original B2 source-backed writing and word ranges
        run: node --experimental-strip-types scripts/test-vnext-b2-writing.mts
      - name: Verify original B2 oral source anchors, decisions and stages
        run: node --experimental-strip-types scripts/test-vnext-b2-oral-continuation.mts
      - name: Upload qualified build
        uses: actions/upload-artifact@v4
        with:
          name: french-p37h-dist-${{ github.sha }}
          path: dist-vnext
          retention-days: 14

  browser:
    needs: qualify
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-desktop, android-chrome]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Confirm exact committed source HEAD
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: french-p37h-dist-${{ github.sha }}
          path: dist-vnext
      - name: Install pinned Playwright
        run: npm install --no-save @playwright/test@1.63.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start qualified vNext build
        shell: bash
        run: |
          set -euo pipefail
          cd dist-vnext
          python3 -m http.server 4175 --bind 127.0.0.1 > /tmp/french-p37h-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4175/vnext-release.json >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/french-p37h-server.log
          exit 1
      - name: Run focused CUR-02 browser navigation against the same qualified build
        env:
          CUR02_BASE_URL: http://127.0.0.1:4175
        run: node tests/cur02-browser.mjs
      - name: R8 isolated U49/U69 flake qualification (three repetitions, no retries)
        id: r8_flakes
        continue-on-error: true
        env:
          P37H_BASE_URL: http://127.0.0.1:4175
        run: |
          npx playwright test --config tests/playwright.p37h.config.mjs --project="${{ matrix.project }}" \
            tests/p37h-u49-original-replay.spec.mjs tests/p37h-u69-b2-pathway.spec.mjs \
            --grep 'U49 complete original partner|U69 legitimate P33 interrupted' \
            --repeat-each=3 --retries=0
      - name: Preserve R8 targeted replay failures before full suite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: french-r8-targeted-${{ matrix.project }}-${{ github.sha }}
          path: test-results/p37h
          if-no-files-found: ignore
          retention-days: 30
      - name: Run P37H parity acceptance
        env:
          P37H_BASE_URL: http://127.0.0.1:4175
        run: npx playwright test --config tests/playwright.p37h.config.mjs --project="${{ matrix.project }}"
      - name: Enforce R8 targeted repeat qualification
        if: always()
        run: test "${{ steps.r8_flakes.outcome }}" = "success"
      - name: Preserve real browser screenshots and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: french-p37h-${{ matrix.project }}-${{ github.sha }}
          path: test-results/p37h
          if-no-files-found: ignore
          retention-days: 30
